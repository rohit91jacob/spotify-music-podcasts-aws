version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    # dbt-core and its adapters (dbt-duckdb, dbt-athena-community) move together; boto3 and moto
    # release several times a week, so they are batched monthly-ish via the group above.
    ignore:
      - dependency-name: dbt-core
        update-types: [version-update:semver-minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
