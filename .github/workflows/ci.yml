name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"
  PYTHON_VERSION: "3.12"
  PYTHONIOENCODING: utf-8
  MUSICPODS_LOG_FORMAT: json
  # Fixture runs must never touch the network: the committed bronze tree is imported instead.
  FIXTURES: tests/fixtures/bronze
  FIXTURE_DATE: "2026-10-09"

jobs:
  lint:
    name: Lint (ruff, pre-commit, gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - name: pre-commit (whitespace, YAML/TOML/JSON, large files, private keys, gitleaks)
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: terraform_fmt # covered by the terraform job, which installs terraform

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run musicpods asl validate
      - run: uv run pytest tests/unit --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml

  pipeline:
    name: Pipeline on fixtures (Step Functions definition -> dbt build), e2e + rerun tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MUSICPODS_DATA_DIR: ${{ github.workspace }}/data/fixtures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Run the whole state machine locally on the fixtures (moto in-process)
        run: uv run musicpods run --from-dir "$FIXTURES" --run-date "$FIXTURE_DATE" --dbt-target ci
      - name: Rerun (must be a no-op for the data)
        run: uv run musicpods run --from-dir "$FIXTURES" --run-date "$FIXTURE_DATE" --dbt-target ci
      - name: dbt build again, standalone
        run: uv run musicpods dbt build --target ci
      - name: Reconciliation + results site
        run: |
          uv run musicpods verify --out site/verification.json
          uv run musicpods report --out site
      - name: End-to-end tests (DQ gates, idempotency, replay duplicates)
        run: uv run pytest -m e2e tests/e2e
      - name: dbt docs
        run: uv run musicpods dbt docs generate --target ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-site-and-dbt-docs
          path: |
            site/
            dbt/target/index.html
            dbt/target/manifest.json
            dbt/target/catalog.json

  dbt-athena:
    name: dbt compile for Athena (no AWS connection)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # dbt-athena builds a boto3 session lazily; compile never calls AWS. Dummy values only.
      AWS_ACCESS_KEY_ID: compile-only
      AWS_SECRET_ACCESS_KEY: compile-only
      AWS_DEFAULT_REGION: eu-west-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --extra athena
      - run: uv run musicpods dbt compile --target athena --no-populate-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: athena-compiled-sql
          path: dbt/target/compiled/

  terraform:
    name: Terraform (fmt, validate, tflint, checkov)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: tflint --init && tflint --recursive --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when tflint downloads the ruleset
      - run: uvx --from checkov==3.3.26 checkov -d . --framework terraform --quiet --compact

  emulator-moto-server:
    name: AWS endpoint path against moto_server (Firehose -> S3 -> Iceberg on S3)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MUSICPODS_AWS_ENDPOINT_URL: http://127.0.0.1:5000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Start moto_server
        run: |
          uv run moto_server -H 127.0.0.1 -p 5000 > moto.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5000/moto-api/ > /dev/null && break; sleep 1; done
      - run: uv run pytest -m integration tests/integration -v
      - if: always()
        run: tail -n 100 moto.log

  emulator-localstack:
    name: AWS endpoint path against LocalStack (Firehose -> S3 -> Iceberg on S3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      localstack:
        # Pinned: newer LocalStack images need an auth token. If LOCALSTACK_AUTH_TOKEN is set as a
        # repository secret it is passed through and any image works.
        image: localstack/localstack:4.4.0
        ports:
          - 4566:4566
        env:
          SERVICES: s3,firehose,iam,sts
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      MUSICPODS_AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: curl -s http://localhost:4566/_localstack/health
      - run: uv run pytest -m integration tests/integration -v
