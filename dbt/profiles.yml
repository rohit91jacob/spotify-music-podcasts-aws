musicpods:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('MUSICPODS_DUCKDB_PATH', '../data/warehouse/musicpods.duckdb') }}"
      threads: 4
    ci:
      type: duckdb
      path: "{{ env_var('MUSICPODS_DUCKDB_PATH', '../data/warehouse/musicpods.duckdb') }}"
      threads: 2
    # Compiled in CI (`dbt compile --target athena`), never run: there is no AWS account.
    athena:
      type: athena
      s3_staging_dir: "{{ env_var('MUSICPODS_ATHENA_STAGING_DIR', 's3://musicpods-dev-athena-results/dbt/') }}"
      s3_data_dir: "{{ env_var('MUSICPODS_ATHENA_DATA_DIR', 's3://musicpods-dev-lake/warehouse/') }}"
      region_name: "{{ env_var('MUSICPODS_AWS_REGION', 'eu-west-1') }}"
      database: awsdatacatalog
      schema: musicpods
      work_group: "{{ env_var('MUSICPODS_ATHENA_WORKGROUP', 'musicpods-dev') }}"
      threads: 4
